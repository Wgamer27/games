<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMES</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #5035c9 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #174ea6 0%, transparent 35%),
        linear-gradient(135deg, #071b52, #30106b, #071b52);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px);
    background-size: 35px 35px;
    opacity: .25;
}

button {
    font-family: inherit;
}

.screen {
    min-height: 100vh;
    padding: 30px;
    position: relative;
    z-index: 1;
}

/* HOME */

#home {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    margin-top: 50px;
    font-size: clamp(55px, 10vw, 110px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow:
        0 0 15px #8b7cff,
        0 0 35px #654cff;
}

.subtitle {
    color: #d8d6ff;
    margin-top: 10px;
    margin-bottom: 50px;
    font-size: 18px;
}

.games-grid {
    width: min(1100px, 100%);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 22px;
}

.game-card {
    min-height: 180px;
    padding: 25px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.09);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
    cursor: pointer;
    transition: .25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.game-card:hover {
    transform: translateY(-8px) scale(1.02);
    background: rgba(255,255,255,.15);
    box-shadow: 0 20px 50px rgba(75,65,255,.35);
}

.game-icon {
    font-size: 50px;
}

.game-card h2 {
    font-size: 24px;
}

.game-card p {
    color: #c8c6e8;
    margin-top: 7px;
}

/* GAME SCREENS */

.game-screen {
    display: none;
    min-height: 100vh;
    padding: 25px;
    position: relative;
    z-index: 2;
}

.game-screen.active {
    display: block;
}

.game-title {
    text-align: center;
    font-size: 42px;
    margin: 10px 0 20px;
}

.back-btn {
    position: absolute;
    left: 25px;
    top: 25px;
    padding: 11px 18px;
    color: white;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    cursor: pointer;
}

.back-btn:hover {
    background: rgba(255,255,255,.22);
}

.instructions {
    text-align: center;
    color: #d8d6ff;
    margin-bottom: 18px;
}

canvas {
    display: block;
    margin: auto;
    max-width: 100%;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3);
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

/* 2048 */

.board2048 {
    width: 420px;
    max-width: 95vw;
    aspect-ratio: 1;
    margin: auto;
    padding: 10px;
    background: rgba(0,0,0,.25);
    border-radius: 15px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

.tile {
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 9px;
    background: rgba(255,255,255,.12);
    font-size: 32px;
    font-weight: bold;
    min-width: 0;
}
