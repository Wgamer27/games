<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMES</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #704cff, transparent 35%),
                radial-gradient(circle at 80% 80%, #008cff, transparent 35%),
                linear-gradient(135deg, #08002b, #22005c, #001d5c);

            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            text-align: center;
            padding: 40px 20px;
        }

        /* LOGO */

        .logo {
            font-size: 90px;
            font-weight: 900;
            letter-spacing: 12px;

            color: white;

            text-shadow:
                0 0 10px #8b7cff,
                0 0 25px #704cff,
                0 0 50px #4c35ff;

            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 20px;
            color: #d8d5ff;
            margin-bottom: 50px;
        }

        /* GAME BUTTONS */

        .games {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }

        .game {
            min-height: 200px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255,255,255,0.25);

            backdrop-filter: blur(15px);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);
        }

        .game:hover {
            transform: translateY(-10px) scale(1.03);

            background:
                rgba(255,255,255,0.18);

            box-shadow:
                0 20px 50px rgba(80,70,255,0.5);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .game h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .game p {
            color: #c9c6e8;
            font-size: 15px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .logo {
                font-size: 50px;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 16px;
            }

            .games {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <h1 class="logo">GAMES</h1>

        <p class="subtitle">
            Welcome! Choose a game below.
        </p>


        <!-- GAMES -->

        <div class="games">

            <div class="game" onclick="playGame('2048')">
                <div class="icon">🔢</div>

                <h2>2048</h2>

                <p>Combine the numbers!</p>
            </div>


            <div class="game" onclick="playGame('Shooter')">
                <div class="icon">🔫</div>

                <h2>2 Player Shooter</h2>

                <p>Battle your friend!</p>
            </div>


            <div class="game" onclick="playGame('Basketball')">
                <div class="icon">🏀</div>

                <h2>2 Player Basketball</h2>

                <p>Score more points!</p>
            </div>


            <div class="game" onclick="playGame('Snake')">
                <div class="icon">🐍</div>

                <h2>Snake</h2>

                <p>Eat the food and grow!</p>
            </div>


            <div class="game" onclick="playGame('Parkour Run')">
                <div class="icon">🏃</div>

                <h2>Parkour Run</h2>

                <p>Run, jump and survive!</p>
            </div>

        </div>

    </div>


    <script>

        function playGame(game) {

            alert(
                game + " is working!\n\n" +
                "The actual game will be added here."
            );

        }

    </script>

</body>
</html>
